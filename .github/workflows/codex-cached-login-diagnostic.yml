name: Codex cached login independent diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/codex-cached-login-diagnostic.yml
      - scripts/review/codex-cached-login-diagnostic.mjs
      - scripts/review/codex-cached-login-diagnostic.check.mjs
      - scripts/review/codex-ci-auth.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-ci-auth-exclusive
  cancel-in-progress: false
jobs:
  synthetic-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node --test scripts/review/codex-cached-login-diagnostic.check.mjs
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'silverThunder09/ai-interview-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install official Codex CLI
        run: npm install --prefix "$RUNNER_TEMP/codex-auth-cli" --no-save --no-audit --no-fund --ignore-scripts @openai/codex@0.159.2
      - name: Check cached login without calling Cloud
        env:
          AIS_CODEX_AUTH_JSON: ${{ secrets.AIS_CODEX_AUTH_JSON }}
        run: node scripts/review/codex-cached-login-diagnostic.mjs
