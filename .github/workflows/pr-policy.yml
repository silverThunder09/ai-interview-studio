name: PR policy
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate PR sections
        run: node scripts/review/policy.mjs body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - run: node scripts/review/policy.test.mjs
      - name: Record tested head and base
        run: node scripts/review/ci-evidence.mjs
