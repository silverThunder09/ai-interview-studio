name: Loop validation
run-name: Approved loop ${{ inputs.key }}
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
      head:
        required: true
        type: string
      base:
        required: true
        type: string
      checkout:
        required: true
        type: string
      key:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: loop-validation-${{ inputs.pr }}-${{ inputs.head }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run licenses
      - name: Record tested head and base
        if: inputs.pr != '0'
        run: node scripts/review/ci-evidence.mjs
      - name: Record tested main
        if: inputs.pr == '0'
        run: git log -1 --format=%H
  package:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run package:win
      - name: Smoke test packaged application
        run: npm run test:smoke
        env:
          SMOKE_EXECUTABLE: release/win-unpacked/AI Interview Studio.exe
      - name: Verify notices and calculate checksum
        shell: pwsh
        run: |
          $required = @('release/win-unpacked/LICENSE.electron.txt', 'release/win-unpacked/LICENSES.chromium.html', 'release/win-unpacked/resources/notices/THIRD-PARTY-NOTICES.txt')
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing notice: $file" } }
          $files = @(Get-ChildItem release/AI-Interview-Studio-*-win-x64.exe)
          if ($files.Count -ne 1) { throw 'Expected exactly one portable executable' }
          $hash = Get-FileHash $files[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($files[0].Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - name: Record tested head and base
        if: inputs.pr != '0'
        run: node scripts/review/ci-evidence.mjs
      - name: Record tested main
        if: inputs.pr == '0'
        run: git log -1 --format=%H
      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: loop-windows-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 1
  pr-policy:
    if: inputs.pr != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate actual PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/review/loop-ci.mjs
      - run: node scripts/review/policy.test.mjs
      - name: Record tested head and base
        run: node scripts/review/ci-evidence.mjs
