name: Independent GitHub schedule diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/independent-schedule-probe.yml
  schedule:
    # Temporary comparison with the existing runner's */5 schedule.
    - cron: '2-59/5 * * * *'
permissions: {}
jobs:
  probe:
    if: github.repository == 'silverThunder09/ai-interview-studio' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record event delivery
        run: printf '%s\n' 'independent_schedule_probe_ran'
