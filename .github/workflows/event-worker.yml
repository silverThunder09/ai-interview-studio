name: Event worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-worker-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'silverThunder09/ai-interview-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # PR comment delivery; worker code must not call PR mutation/merge APIs.
      checks: read # Current check runs; no ability to publish successful checks.
      contents: write # Only automation/event-ledger; needed for atomic non-force ref updates.
      issues: write # Bounded PR comments and deduplicated pause issues; no merge API.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Reconcile current PRs and deliver durable Cloud requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIS_CODEX_COMMENT_TOKEN: ${{ secrets.AIS_CODEX_COMMENT_TOKEN }}
        run: |
          export AIS_CHECKOUT_SHA="$(git rev-parse HEAD)"
          node --experimental-strip-types scripts/review/event-worker.ts
