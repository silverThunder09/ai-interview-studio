name: Current main CI readiness
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Validation, Windows build]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  readiness:
    if: >-
      github.repository == 'silverThunder09/ai-interview-studio' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify current main CI and checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/review/main-ci-proof.mjs
